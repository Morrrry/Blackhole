<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OpenAI O-Series Gantt Chart</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }

    .gantt {
      position: relative;
      border-left: 2px solid #444;
      border-bottom: 2px solid #444;
      padding-left: 100px;
      overflow-x: auto;
      max-width: 100%;
    }

    .row {
      display: flex;
      align-items: center;
      height: 40px;
      position: relative;
    }

    .label {
      position: absolute;
      left: -100px;
      width: 90px;
      text-align: right;
      padding-right: 10px;
      font-weight: bold;
    }

    .bar {
      height: 20px;
      background-color: #4CAF50;
      border-radius: 4px;
      position: absolute;
    }

    .timeline {
      display: flex;
      margin-top: 10px;
      margin-left: 100px;
    }

    .time {
      width: 100px;
      text-align: center;
      font-size: 12px;
      border-left: 1px solid #ccc;
    }
  </style>
</head>
<body>

<h2>OpenAI O-Series Gantt Chart</h2>

<div class="timeline" id="timeline"></div>
<div class="gantt" id="gantt"></div>

<script>
  const models = [
    { name: "o1", start: "2023-03", end: "2023-11" },
    { name: "o2", start: "2023-11", end: "2024-03" },
    { name: "o3", start: "2024-03", end: "2024-12" },
    { name: "o4-mini", start: "2024-05", end: "2025-06" },
    { name: "o4", start: "2024-06", end: "2025-06" },
  ];

  // 时间线从 2023-03 到 2025-06
  const startDate = new Date("2023-03-01");
  const endDate = new Date("2025-06-01");

  function getMonthDiff(d1, d2) {
    return (d2.getFullYear() - d1.getFullYear()) * 12 + (d2.getMonth() - d1.getMonth());
  }

  const totalMonths = getMonthDiff(startDate, endDate) + 1;

  const timelineEl = document.getElementById("timeline");
  for (let i = 0; i < totalMonths; i++) {
    const d = new Date(startDate.getFullYear(), startDate.getMonth() + i, 1);
    const label = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
    const div = document.createElement("div");
    div.className = "time";
    div.textContent = label;
    timelineEl.appendChild(div);
  }

  const ganttEl = document.getElementById("gantt");

  models.forEach((model, idx) => {
    const row = document.createElement("div");
    row.className = "row";

    const label = document.createElement("div");
    label.className = "label";
    label.textContent = model.name;
    row.appendChild(label);

    const bar = document.createElement("div");
    bar.className = "bar";

    const start = new Date(model.start + "-01");
    const end = new Date(model.end + "-01");
    const offset = getMonthDiff(startDate, start);
    const width = getMonthDiff(start, end) + 1;

    bar.style.left = `${offset * 100}px`;
    bar.style.width = `${width * 100}px`;

    row.appendChild(bar);
    ganttEl.appendChild(row);
  });
</script>

</body>
</html>
