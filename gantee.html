<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OpenAI O系列模型甘特图</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/frappe-gantt@0.5.0/dist/frappe-gantt.css" />
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: #f0f2f5;
      padding: 100px;
    }
    h2 {
      text-align: center;
      margin-bottom: 30px;
    }
    #gantt-target {
      width: 100%;
      width: 960px;        
      height: 540px;
      border-radius: 16px;
      margin: 0 auto;
      border: 10px solid #ccc;
      background: #fff;
    }
    .invisible-bar .bar {
      opacity: 0;
    }
    .gantt .bar-label {
    font-size: 20px;
    font-weight: bold;
  }

  .gantt .upper-text {
    font-size: 20px;
    font-weight: bold;
  }

  .gantt .lower-text {
    font-size: 20px;
  }

  </style>
</head>
<body>

  <h2>OpenAI O系列模型发布周期甘特图</h2>
  <div id="gantt-target"></div>

  <!-- 放在 body 结尾以确保加载顺序正确 -->
  <script src="https://cdn.jsdelivr.net/npm/frappe-gantt@0.5.0/dist/frappe-gantt.min.js"></script>
  <script>
    const tasks = [
    {
        id: 'start-anchor',
        name: '',
        start: '2024-09-01',
        end: '2024-09-01',
        progress: 0,
        custom_class: 'invisible-bar'
      },
      {
        id: 'end-anchor',
        name: '',
        start: '2025-06-01',
        end: '2025-06-01',
        progress: 0,
        custom_class: 'invisible-bar'
      },
      {
        id: "o1-preview",
        name: "o1-preview",
        start: "2024-09-12",
        end: "2024-12-05",
        progress: 100,
      },
      {
        id: "o1",
        name: "o1",
        start: "2024-12-05",
        end: "2025-04-16",
        progress: 100,
      },
      {
        id: "o3-mini",
        name: "o3-mini",
        start: "2025-01-31",
        end: "2025-04-16",
        progress: 100,
      },
      {
        id: "o3",
        name: "o3",
        start: "2025-04-16",
        end: "2025-12-31",
        progress: 70,
      },
      {
        id: "o4-mini",
        name: "o4-mini",
        start: "2025-04-16",
        end: "2025-12-31",
        progress: 70,
      }
    ];

    new Gantt("#gantt-target", tasks, {
      view_mode: 'Month',
      date_format: 'YYYY-MM-DD',
      column_width: 160, 
      custom_popup_html: null
    });
  </script>

</body>
</html>
