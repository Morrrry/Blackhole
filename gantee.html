<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OpenAI 模型发布时间甘特图</title>
  <script type="module" src="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.css" />
  <style>
    body {
      font-family: 'Arial', sans-serif;
      margin: 20px;
      background: #f9f9f9;
    }
    h2 {
      text-align: center;
    }
    #gantt {
      width: 100%;
      height: 600px;
      overflow-x: auto;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: white;
    }
  </style>
</head>
<body>
  <h2>OpenAI O系列模型发布时间甘特图</h2>
  <div id="gantt"></div>

  <script>
    const tasks = [
      {
        id: "o1-preview",
        name: "o1-preview",
        start: "2024-09-12",
        end: "2024-12-05",
        progress: 100,
      },
      {
        id: "o1",
        name: "o1",
        start: "2024-12-05",
        end: "2025-04-16",
        progress: 100,
      },
      {
        id: "o3-mini",
        name: "o3-mini",
        start: "2025-01-31",
        end: "2025-04-16",
        progress: 100,
      },
      {
        id: "o3",
        name: "o3",
        start: "2025-04-16",
        end: "2025-12-31",
        progress: 70,
      },
      {
        id: "o4-mini",
        name: "o4-mini",
        start: "2025-04-16",
        end: "2025-12-31",
        progress: 70,
      }
    ];

    const gantt = new Gantt("#gantt", tasks, {
      view_mode: 'Month',
      date_format: 'YYYY-MM-DD',
      custom_popup_html: null,
    });
  </script>
</body>
</html>
